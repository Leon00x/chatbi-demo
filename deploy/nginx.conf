# Dedicated demo host; disable the distribution's default site first.
server {
    listen 80;
    server_name _;

    root /var/www/chatbi-demo;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No trailing slash: preserve the /api prefix expected by FastAPI.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # SQL planning plus optional analysis may make two 60-second calls.
        proxy_read_timeout 150s;
    }
}
