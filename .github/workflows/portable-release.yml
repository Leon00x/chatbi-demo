name: Build portable releases

on:
  push:
    branches: [codex/portable-releases]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build and check the ZIP
        run: |
          python -m pip install uv==0.13.4
          python packaging/build.py ${{ matrix.target }}
          python packaging/check.py dist/chatbi-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chatbi-${{ matrix.target }}
          path: dist/chatbi-${{ matrix.target }}.zip
          if-no-files-found: error
